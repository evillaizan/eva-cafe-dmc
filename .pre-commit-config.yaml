# Hooks que se ejecutan antes de cada commit.
# Instalar una vez por clon: poetry run pre-commit install
#
# Ruff se ejecuta desde el entorno de Poetry (hook local) para usar la misma
# versión fijada en poetry.lock que `poetry run ruff check .`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
